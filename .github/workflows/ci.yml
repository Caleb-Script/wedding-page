name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMNIXYS_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}
  NODE_ENV: production

  NEXT_PUBLIC_EVENT_ID: ${{ secrets.NEXT_PUBLIC_EVENT_ID }}
  NEXT_PUBLIC_ANALYTICS_GATEWAY_URL: https://api.omnixys.com
  NEXT_PUBLIC_API_URL: https://cgr.omnixys.com

  ANALYTICS_CONSENT_SECRET: ${{ secrets.ANALYTICS_CONSENT_SECRET }}

  MINIO_ENDPOINT: s3.omnixys.com
  MINIO_PORT: 443
  MINIO_USE_SSL: true
  MINIO_ACCESS_KEY: omnixys
  MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  MINIO_PUBLIC_URL: https://s3.omnixys.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate temporary .npmrc (git-ignored, never committed)
        run: node scripts/setup-npmrc.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Remove temporary .npmrc
        if: always()
        run: node scripts/setup-npmrc.js --remove
